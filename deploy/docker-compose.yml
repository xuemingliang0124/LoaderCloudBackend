# 平台侧：MySQL + MinIO + Elasticsearch + Master
# 启动：docker compose -f deploy/docker-compose.yml up -d --build

name: ptp

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4.10
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ptp
      MYSQL_USER: ptp
      MYSQL_PASSWORD: ptp123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - "mysqld"
      - "--mysql-native-password=ON"       # ✅ 替换为这个新参数
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    restart: unless-stopped

  minio:
    # minio/minio 在 Docker Hub 被 daocloud 拒（denied），改走其 quay 镜像（MinIO 官方双发）
    image: quay.m.daocloud.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 允许 Prometheus 免鉴权抓取 /minio/v2/metrics/cluster（内网监控用）
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  elasticsearch:
    # elasticsearch 是 Docker Hub 官方镜像（library 命名空间），与 docker.elastic.co 内容一致
    image: docker.m.daocloud.io/library/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    # 生产从 ACR 拉取；本地开发由 docker-compose.override.yml 注入 build: ./kibana
    image: ${REGISTRY:-registry.cn-beijing.aliyuncs.com/xml066}/ptp-kibana:${IMAGE_TAG:-latest}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  # 向量库：承担 pt-knowledge 语义检索（D2 引入）。
  # 选用 Qdrant 单容器：Rust 实现 + async SDK 原生，契合 ptp-dev 3.1 异步约束。
  # ES 仅保留 pt-summary/pt-metrics 职责，不再扩展 dense_vector。
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  master:
    # 生产从 ACR 拉取；本地开发由 docker-compose.override.yml 注入 build: ../master
    image: ${REGISTRY:-registry.cn-beijing.aliyuncs.com/xml066}/ptp-master:${IMAGE_TAG:-latest}
    # 容器配置统一来自 deploy/.env（env_file 注入容器；该文件同时是 compose 插值源）
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # presigned URL 对外地址：Agent 侧必须能解析该主机名。
      # 默认 host.docker.internal:9000 适用于同机 Docker Desktop/Linux(需 agent 侧 host-gateway)；
      # 跨机部署必须改为 MinIO 宿主机真实 IP:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-host.docker.internal:9000}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  es_data:
  qdrant_data:
