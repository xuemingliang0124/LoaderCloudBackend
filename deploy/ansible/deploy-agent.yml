---
# =============================================================================
# Agent 批量部署/升级 playbook（配合 inventory.yml 使用）
#
# 用法：
#   ansible-playbook -i inventory.yml deploy-agent.yml -e image_tag=42-a1b2c3d
#   ansible-playbook -i inventory.yml deploy-agent.yml --limit room_a       # 灰度
#   ansible-playbook -i inventory.yml deploy-agent.yml -e busy_action=wait  # 忙机器等待而非跳过
#
# 控制器依赖：ansible >= 2.14 + community.docker collection
#   ansible-galaxy collection install community.docker
# 目标机依赖：docker + docker compose plugin；SSH 用户可 sudo（become）
#
# 忙检测（避让正在执行的场景）：
#   经 Master GET /api/v1/agents 查询本机 Agent（按 IP 精确匹配）。心跳带
#   current_run_no 时 status=busy → 默认整机跳过（不写配置、不重启），结尾汇总
#   并置失败，提示稍后 --limit 重跑；-e busy_action=wait 改为轮询等待空闲。
#
# 密钥认证引导（新机器免手工初始化）：
#   Play1 用 CI 私钥探活；密钥认证不通的主机（新装/重装机器未装公钥）由
#   Play2 归入 ssh_bootstrap 动态组，Play3 以密码登录（环境变量 AGENT_SSH_PASS，
#   Jenkins 凭据注入，不出现在进程命令行）完成机器初始化：
#   ① 安装公钥（bootstrap_pubkey，由 Jenkins 从 CI 私钥 ssh-keygen -y 导出）；
#   ② 配置 appuser 免密 sudo（/etc/sudoers.d/，供主 play become 使用；
#      sudo 密码取 AGENT_SSH_PASS，要求与 SSH 登录密码一致）。
#   未配置密码时跳过引导，保持旧行为。
#   前提：目标机 appuser 已存在且 sshd 允许密码认证（PasswordAuthentication yes）。
#
# 已知竞态窗口：任务下发 → 首个 BUSY 心跳存在 ≤10s 空隙，且检测与重启间有秒级
#   间隙；请避开定时压测窗口执行部署。彻底根治需 Master 提供 drain（调度屏蔽）
#   能力，属后续迭代。
# =============================================================================

# ---------- Play 1：SSH 密钥认证预检 ----------
- name: SSH 密钥认证预检（不通的主机将引导装公钥）
  hosts: all
  gather_facts: false
  tasks:
    - name: 密钥认证探活
      ansible.builtin.ping:
      register: key_probe
      ignore_unreachable: true

# ---------- Play 2：收集需引导的主机（控制器侧操作，不产生目标机连接） ----------
# unreachable 状态是 per-play 的，Play 1 标记不影响本 play；add_host/set_fact
# 均为控制器侧 action，无需 SSH。
- name: 收集密钥认证失败的主机
  hosts: all
  gather_facts: false
  tasks:
    - name: 读取引导密码（环境变量注入，避免出现在进程命令行）
      ansible.builtin.set_fact:
        bootstrap_ssh_pass: "{{ lookup('env', 'AGENT_SSH_PASS') }}"

    - name: 归入 ssh_bootstrap 组（携带密码认证参数）
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: ssh_bootstrap
        ansible_ssh_pass: "{{ bootstrap_ssh_pass }}"
      when:
        - key_probe.unreachable is defined
        - bootstrap_ssh_pass | length > 0

# ---------- Play 3：密码登录机器初始化 ----------
- name: 引导：密码登录机器初始化（装公钥 + 免密 sudo）
  hosts: ssh_bootstrap
  gather_facts: false
  # 写 appuser 自己的家目录无需 become；sudoers 提权在对应任务级单独 become
  become: false
  tasks:
    - name: 校验引导参数
      ansible.builtin.assert:
        that:
          - bootstrap_pubkey | default('') | length > 0
        fail_msg: "bootstrap_pubkey 未注入：Jenkins 需以 ssh-keygen -y 从 CI 私钥导出公钥并 -e 传入"

    - name: 确保用户 .ssh 目录存在
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0700"

    - name: 安装公钥到 authorized_keys（幂等）
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        line: "{{ bootstrap_pubkey }}"
        state: present
        create: true
        owner: "{{ ansible_user }}"
        mode: "0600"

    # 机器初始化第二步：免密 sudo，供主 play become 使用（此后 sudo 密码不再被需要）。
    # sudo 密码取 AGENT_SSH_PASS（要求与 SSH 登录密码一致）；已配置 NOPASSWD 的
    # 机器本任务幂等跳过。validate 走 visudo 防止写坏 sudoers。
    # 注意：become 密码必须用 ansible_become_pass 变量（任务关键字无 become_pass）
    - name: 配置免密 sudo（NOPASSWD，机器初始化）
      ansible.builtin.copy:
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ ansible_user }}"
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
      become: true
      vars:
        ansible_become_pass: "{{ bootstrap_ssh_pass }}"

- name: 部署 / 升级 Agent（忙机器自动避让）
  hosts: all
  become: true
  gather_facts: false
  # 滚动批次：Agent 重启会断 WS，Master 30s 心跳超时会判 OFFLINE；
  # 一次只动 N 台，避免整批失联影响进行中的 run
  serial: "{{ ansible_serial | default(5) }}"

  vars:
    registry: registry.cn-beijing.aliyuncs.com/xml066
    image_tag: latest
    deploy_dir: /opt/ptp
    agent_workspace: /data/ptp_agent/workspace
    agent_compose_file: docker-compose.agent.yml
    # 网络模式：true → network_mode: host（Linux 生产推荐，压测吞吐必须）
    #           false → bridge + extra_hosts（Docker Desktop 等不支持 host 网络）
    # inventory 可按分组覆盖；Jenkins 以 -e use_host_network= 注入
    use_host_network: true
    # Master 地址不在此定义：play vars 优先级高于 inventory vars，写在这里会
    # 静默覆盖 inventory all.vars 的配置。改由 pre_task set_fact 兜底默认值。
    master_api_user: "{{ lookup('env', 'MASTER_API_USER') | default('admin', true) }}"
    master_api_pass: "{{ lookup('env', 'MASTER_API_PASS') }}"
    # 忙机器处理：skip=跳过（结尾汇总可置失败）；wait=轮询等待空闲再更新
    busy_action: skip
    busy_wait_timeout: 1800
    busy_wait_interval: 30
    fail_on_busy: true
    # ACR 免密配置（控制器侧路径；文件不存在则跳过复制，视镜像为公开）
    docker_config_src: "{{ lookup('env', 'HOME') }}/.docker/config.json"
    # become（sudo）密码：默认复用 AGENT_SSH_PASS，假设 sudo 密码与 SSH 登录密码一致。
    # 已配置 NOPASSWD sudoers 的机器不会用到本值；两者不一致的机器必须走 NOPASSWD，
    # 否则报 Incorrect sudo password。AGENT_SSH_PASS 未注入时行为同旧版（报 Missing sudo password）
    ansible_become_pass: "{{ lookup('env', 'AGENT_SSH_PASS') }}"
    # Master 看到的 Agent IP 默认与 ansible_host 一致（NAT 机器在 inventory 指定 agent_ip）
    agent_ip: "{{ ansible_host }}"

  pre_tasks:
    # Master 地址：inventory all.vars / Jenkins -e 注入优先；均未配置时回退 127.0.0.1
    - name: 应用 Master 地址默认值（inventory / extra-vars 可覆盖）
      ansible.builtin.set_fact:
        master_ws_url: "{{ master_ws_url | default('ws://127.0.0.1:8000/ws/agent', true) }}"
        master_api_base: "{{ master_api_base | default('http://127.0.0.1:8000/api/v1', true) }}"

  tasks:
    - name: 校验必填配置
      ansible.builtin.assert:
        that:
          - master_api_user | length > 0
          - master_api_pass | length > 0
          - busy_action in ['skip', 'wait']
        fail_msg: "缺少 Master API 凭据或 busy_action 非法：需注入环境变量 MASTER_API_USER / MASTER_API_PASS"

    # ---------- 忙检测（delegate 到控制器执行，不依赖目标机） ----------

    - name: 登录 Master 获取 JWT（每个滚动批次重新登录，规避长等待 token 过期）
      ansible.builtin.uri:
        url: "{{ master_api_base }}/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ master_api_user }}"
          password: "{{ master_api_pass }}"
        status_code: 200
      register: master_login
      delegate_to: localhost
      become: false

    - name: 查询本机 Agent 状态（keyword 按 IP 粗筛，本地精确比对）
      ansible.builtin.uri:
        url: "{{ master_api_base }}/agents?keyword={{ agent_ip | urlencode }}&page_size=100"
        headers:
          Authorization: "Bearer {{ master_login.json.data.token }}"
        status_code: 200
      register: agent_probe
      delegate_to: localhost
      become: false
      # skip 模式：查一次即过；wait 模式：轮询直到该机器不在 busy 名单
      # 注意 items 必须用 ['items']：dict 自带 .items() 方法，Jinja 属性查找
      # 会命中方法而非列表键（'method' object is not iterable）
      until: >-
        busy_action == 'skip'
        or (agent_probe.json.data['items'] | selectattr('ip', 'equalto', agent_ip)
            | selectattr('status', 'equalto', 'busy') | list | length == 0)
      retries: "{{ 1 if busy_action == 'skip' else (busy_wait_timeout // busy_wait_interval) | int }}"
      delay: "{{ 0 if busy_action == 'skip' else busy_wait_interval }}"

    - name: 判定本机是否忙（IP 精确匹配 status=busy；未注册/离线视为空闲）
      ansible.builtin.set_fact:
        agent_busy: >-
          {{ agent_probe.json.data['items'] | selectattr('ip', 'equalto', agent_ip)
             | selectattr('status', 'equalto', 'busy') | list | length > 0 }}

    - name: 因忙跳过提示
      ansible.builtin.debug:
        msg: >-
          Agent {{ agent_ip }} 正在执行场景（status=busy），跳过本次更新；
          稍后可用 --limit 单独重跑，或 -e busy_action=wait 等待空闲
      when: agent_busy

    # ---------- 部署（仅空闲机器执行） ----------

    - name: 确保部署目录存在
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"
      when: not agent_busy

    - name: 渲染 Agent compose 配置（network_mode 由 use_host_network 决定）
      ansible.builtin.template:
        src: docker-compose.agent.j2
        dest: "{{ deploy_dir }}/{{ agent_compose_file }}"
        mode: "0644"
      when: not agent_busy

    # 新机器 root 从未跑过 docker login，/root/.docker 不存在，需先建目录
    - name: 确保目标机 /root/.docker 目录存在
      ansible.builtin.file:
        path: /root/.docker
        state: directory
        mode: "0700"
      when: not agent_busy and docker_config_src is exists

    - name: 下发 ACR 免密配置（控制器文件存在才复制；目标机 root 的 docker 凭据）
      ansible.builtin.copy:
        src: "{{ docker_config_src }}"
        dest: /root/.docker/config.json
        mode: "0600"
      when: not agent_busy and docker_config_src is exists

    # host 网络下 Docker 禁止容器设置 net.* sysctl（runc: not allowed in host
    # network namespace），压测端口调优转为宿主机级持久化（bridge 模式仍由
    # compose 模板内 sysctls 承担，无需本任务）
    - name: 宿主机内核网络调优（host 网络模式专属）
      ansible.builtin.copy:
        content: |
          # ptp-agent 压测调优：临时端口范围 + TIME_WAIT 复用（部署流水线维护）
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_tw_reuse = 1
        dest: /etc/sysctl.d/99-ptp-agent.conf
        mode: "0644"
      when: use_host_network | bool

    - name: 加载内核网络参数
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-ptp-agent.conf
      when: use_host_network | bool
      changed_when: false

    - name: 拉取新镜像并按需重建容器
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        files:
          - "{{ deploy_dir }}/{{ agent_compose_file }}"
        state: present
        pull: always
      when: not agent_busy

# ---------- 结果汇总（独立 play：跨滚动批次聚合） ----------
- name: 汇总部署结果
  hosts: all
  gather_facts: false
  vars:
    fail_on_busy: true
  tasks:
    - name: 统计因忙跳过的节点
      ansible.builtin.set_fact:
        busy_skipped: "{{ busy_skipped | default([]) + [item] }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].agent_busy | default(false) | bool
      run_once: true

    - name: 输出汇总
      ansible.builtin.debug:
        msg: >-
          {{ groups['all'] | length }} 台压力机处理完成；
          因忙跳过 {{ busy_skipped | default([]) | length }} 台{{
          ': ' + (busy_skipped | default([]) | join(', ')) if busy_skipped | default([]) else '' }}
      run_once: true

    - name: 忙节点存在时置失败（-e fail_on_busy=false 可关闭）
      ansible.builtin.fail:
        msg: >-
          有 {{ busy_skipped | default([]) | length }} 台因忙跳过：
          {{ busy_skipped | default([]) | join(', ') }}。
          请避开压测窗口后用 --limit 重跑这些机器，或 -e busy_action=wait 等待空闲
      when: fail_on_busy | bool and busy_skipped | default([]) | length > 0
      run_once: true
